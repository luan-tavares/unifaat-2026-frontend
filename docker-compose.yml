services:

  #NODE WEB
  nodeweb-container:
    build:
      context: .
      dockerfile: docker/node-web/Dockerfile
    env_file:
      - .env
      - .env.docker
    volumes:
      - ./src:/app
      - public-volume:/app/public
      - nodemodules-volume:/app/node_modules
    depends_on:
      - postgres-container
      - elasticsearch-container
      - rabbitmq-container
      - redis-container
    environment:
      POSTGRES_HOST: postgres_host
      POSTGRES_PORT: 5432
      ELASTIC_HOST: elasticsearch_host
      ELASTIC_PORT: 9200
      RABBITMQ_HOST: rabbitmq_host
      RABBITMQ_PORT: 5672
      REDIS_HOST: redis_host
      REDIS_PORT: 6379
    restart: unless-stopped
    networks:
      edge-network:   # o nginx chega por aqui
        aliases:
          - nodeweb_host
      data-network:   # e daqui alcança os dados: a ponte entre as duas redes
        aliases:
          - nodeweb_host

  #NODE COMMAND
  nodecommand-container:
    build:
      context: .
      dockerfile: docker/node-command/Dockerfile
    env_file:
      - .env
      - .env.docker
    volumes:
      - ./src:/app
      - nodemodules-volume:/app/node_modules
    depends_on:
      - postgres-container
      - elasticsearch-container
      - rabbitmq-container
      - redis-container
    environment:
      POSTGRES_HOST: postgres_host
      POSTGRES_PORT: 5432
      ELASTIC_HOST: elasticsearch_host
      ELASTIC_PORT: 9200
      RABBITMQ_HOST: rabbitmq_host
      RABBITMQ_PORT: 5672
      REDIS_HOST: redis_host
      REDIS_PORT: 6379
    networks:
      data-network:
        aliases:
            - nodecommand_host

  #NODE WORKER
  nodeworker-container:
    build:
      context: .
      dockerfile: docker/node-worker/Dockerfile
    env_file:
      - .env
      - .env.docker
    volumes:
      - ./src:/app
      - nodemodules-volume:/app/node_modules
    depends_on:
      - postgres-container
      - rabbitmq-container
      - elasticsearch-container
      - redis-container
    environment:
      POSTGRES_HOST: postgres_host
      POSTGRES_PORT: 5432
      ELASTIC_HOST: elasticsearch_host
      ELASTIC_PORT: 9200
      RABBITMQ_HOST: rabbitmq_host
      RABBITMQ_PORT: 5672
      REDIS_HOST: redis_host
      REDIS_PORT: 6379
    restart: unless-stopped
    networks:
      data-network:
        aliases:
          - nodeworker_host

  #NODE WORKER (fila save-message): mesma imagem, outra fila; grava as mensagens do chat no Postgres
  nodeworkersavemessage-container:
    build:
      context: .
      dockerfile: docker/node-worker/Dockerfile
    # Argumentos do entrypoint (nodemon _worker.js): a fila que este worker consome
    command: ["--queue", "save-message"]
    env_file:
      - .env
      - .env.docker
    volumes:
      - ./src:/app
      - nodemodules-volume:/app/node_modules
    depends_on:
      - postgres-container
      - rabbitmq-container
      - redis-container
    environment:
      POSTGRES_HOST: postgres_host
      POSTGRES_PORT: 5432
      RABBITMQ_HOST: rabbitmq_host
      RABBITMQ_PORT: 5672
      REDIS_HOST: redis_host
      REDIS_PORT: 6379
    restart: unless-stopped
    networks:
      data-network:
        aliases:
          - nodeworkersavemessage_host

  #NODE WEBSOCKET
  nodewebsocket-container:
    build:
      context: .
      dockerfile: docker/node-websocket/Dockerfile
    # Argumentos do entrypoint: o exchange que este servidor assina e a porta (só dentro da rede)
    command: ["--exchange", "notifications", "--port", "3001"]
    env_file:
      - .env
      - .env.docker
    volumes:
      - ./src:/app
      - nodemodules-volume:/app/node_modules
    depends_on:
      - rabbitmq-container
    environment:
      RABBITMQ_HOST: rabbitmq_host
      RABBITMQ_PORT: 5672
    restart: unless-stopped
    networks:
      edge-network:   # o nginx chega por aqui
        aliases:
          - nodewebsocket_host
      data-network:   # e daqui alcança os dados: a ponte entre as duas redes
        aliases:
          - nodewebsocket_host

  #NODE VITE HMR
  nodevitehmr-container:
    build:
      context: .
      dockerfile: docker/node-vite-hmr/Dockerfile
    env_file:
      - .env.docker
    volumes:
      - ./src/resources:/app/resources
      - nodemodules-volume:/app/node_modules
    restart: unless-stopped
    ports:
      - "5172:5172"
    networks:
      - edge-network   # só a borda: não enxerga o banco

  #NODE VITE COMPILER
  nodevitecompiler-container:
    build:
      context: .
      dockerfile: docker/node24-vite-compiler/Dockerfile
    volumes:
      - public-volume:/app/public
      - ./src/resources:/app/resources
      - nodemodules-volume:/app/node_modules
    restart: unless-stopped
    environment:
      - IS_CONTAINER=TRUE
    networks:
      - edge-network   # só a borda: não enxerga o banco

  #NGINX
  nginx-container:
    build:
      context: .
      dockerfile: docker/nginx/Dockerfile
    env_file:
      - .env
    ports:
      - "${NGNIX_WEB_PORT}:${NGINX_PORT}"
    volumes:
      - public-volume:/var/www
      - ./aulas:/var/www/aulas
      - ./src/logs/nginx:/var/log/nginx
      - ./docker/nginx/default.conf.template:/etc/nginx/templates/default.conf.template:ro
    depends_on:
      - nodeweb-container
      - nodewebsocket-container
    networks:
      - edge-network   # só a borda: não enxerga o banco

  #POSTGRES
  postgres-container:
    image: postgres:18
    restart: unless-stopped
    env_file:
      - .env
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
      TZ: America/Sao_Paulo
    ports:
      - "${POSTGRES_PORT}:5432"
    volumes:
      - postgres-volume:/var/lib/postgresql
      - ./src/docker/postgres/init:/docker-entrypoint-initdb.d
    networks:
      data-network:
        aliases:
          - postgres_host

  #ELASTICSEARCH
  elasticsearch-container:
    image: elasticsearch:9.5.5
    restart: unless-stopped
    environment:
      - discovery.type=single-node # Um nó só, sem cluster
      - xpack.security.enabled=false # Sem usuário/senha/HTTPS: só porque NÃO tem porta exposta
      - ES_JAVA_OPTS=-Xms512m -Xmx512m # Limita a memória da JVM
    # Sem "ports": só a rede interna (data-network) alcança o Elasticsearch
    volumes:
      - elastic-volume:/usr/share/elasticsearch/data
    networks:
      data-network:
        aliases:
          - elasticsearch_host

  #RABBITMQ
  rabbitmq-container:
    image: rabbitmq:3.13.1-management-alpine
    restart: unless-stopped
    ports:
      - "5672:5672"    # Porta para conexão com a fila (producers/consumers)
      - "15672:15672"  # Porta do painel de gerenciamento web
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_USER}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASSWORD}
    volumes:
      - rabbitmq-volume:/var/lib/rabbitmq
    networks:
      data-network:
        aliases:
          - rabbitmq_host

  #REDIS (cache): porta publicada no host para inspecionar (redis-cli, RedisInsight); sem volume, cache se perde e se refaz
  redis-container:
    image: redis:7.4-alpine
    restart: unless-stopped
    ports:
      - "${REDIS_HOST_PORT:-6375}:6379"
    networks:
      data-network:
        aliases:
          - redis_host

  #PROMETHEUS (coleta e guarda as métricas): busca o /metrics do nodeweb a cada 5 s (pull) pela data-network
  nginx-exporter-container:
    image: nginx/nginx-prometheus-exporter:1.4.2
    restart: unless-stopped
    command: ["--nginx.scrape-uri=http://nginx-container:8081/stub_status"]
    depends_on:
      - nginx-container
    networks:
      edge-network:
      data-network:
        aliases:
          - nginx-exporter_host

  prometheus-container:
    image: prom/prometheus:v3.5.0
    restart: unless-stopped
    depends_on:
      - nodeweb-container
      - nginx-exporter-container
    ports:
      - "${PROMETHEUS_PORT:-9090}:9090"   # a interface do Prometheus (Status > Targets mostra o nodeweb)
    volumes:
      - ./docker/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml
      - prometheus-volume:/prometheus
    networks:
      data-network:
        aliases:
          - prometheus_host

  #GRAFANA (só mostra): consulta o Prometheus (métricas) e o Postgres (as mensagens do chat). Nas DUAS redes
  grafana-container:
    image: grafana/grafana:12.1.0
    restart: unless-stopped
    env_file:
      - .env
    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_PASSWORD:-admin}
      GF_USERS_ALLOW_SIGN_UP: "false"
      # O datasource do Postgres lê estas variáveis (provisioning interpola $VAR)
      POSTGRES_HOST: postgres_host
      POSTGRES_PORT: 5432
    depends_on:
      - prometheus-container
      - postgres-container
    ports:
      - "${GRAFANA_PORT:-3002}:3000"
    volumes:
      - ./docker/grafana/provisioning:/etc/grafana/provisioning
      - grafana-volume:/var/lib/grafana
    networks:
      edge-network:
        aliases:
          - grafana_host
      data-network:
        aliases:
          - grafana_host

networks:
  # Borda: o que fala com o navegador (nginx, Vite) e a ponte (nodeweb, nodewebsocket)
  edge-network:
    driver: bridge
  # Dados: bancos, cache, fila, workers e comandos; sem porta publicada, só quem está aqui alcança
  data-network:
    driver: bridge

volumes:
  nodemodules-volume:
  public-volume:
  postgres-volume:
  elastic-volume:
  rabbitmq-volume:
  prometheus-volume:
  grafana-volume:
