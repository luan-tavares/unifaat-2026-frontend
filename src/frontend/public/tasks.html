<!DOCTYPE html>
<html lang="pt-BR">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Tasks - Minhas Tarefas</title>
  <link rel="icon" type="image/png" href="./img/favicon.ico">
  <link
    rel="stylesheet"
    href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
    integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH"
    crossorigin="anonymous"
  >
  <link rel="stylesheet" href="./css/app.css">
  <script src="https://cdn.jsdelivr.net/npm/axios@1.7.9/dist/axios.min.js"></script>
  <script type="module" src="./js/pages/tasks.ts"></script>
</head>

<body class="d-flex flex-column min-vh-100 bg-light">

  <header class="bg-primary text-white d-flex justify-content-between align-items-center py-4 px-4 shadow-sm">
    <h1 class="h3 m-0">Minhas Tarefas</h1>
    <button id="logout-btn" class="btn btn-light btn-sm">Sair</button>
  </header>

  <main class="container flex-grow-1 py-5 d-flex flex-column flex-lg-row gap-4">

    <section id="tasks-container" class="card shadow-sm p-4 flex-grow-1"></section>

    <section id="add-task-section" class="card shadow-sm p-4 d-flex flex-column gap-2 text-center">
      <h5>Nova Tarefa</h5>
      <input type="text" id="task-input" class="form-control" placeholder="Digite a tarefa..." />
      <button id="add-task-btn" class="btn btn-primary" type="button">Adicionar</button>
      <hr class="my-3">
      <button class="btn btn-outline-primary" type="button" data-bs-toggle="modal" data-bs-target="#assign-task-modal">
        Nova tarefa para outro usuário
      </button>
    </section>

  </main>

  <div class="modal fade" id="assign-task-modal" tabindex="-1" aria-labelledby="assign-task-modal-title" aria-hidden="true">
    <div class="modal-dialog modal-dialog-centered modal-lg">
      <div class="modal-content">
        <div class="modal-header">
          <h5 class="modal-title" id="assign-task-modal-title">Criar tarefa para outro usuário</h5>
          <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Fechar"></button>
        </div>
        <div class="modal-body">
          <div class="mb-3">
            <label for="assign-task-name" class="form-label">Nome da tarefa</label>
            <input type="text" class="form-control" id="assign-task-name" placeholder="Digite o nome da tarefa">
          </div>
          <hr>
          <h6>Encontrar usuário</h6>
          <div class="row g-2 align-items-end">
            <div class="col-md-4">
              <label for="assign-search-field" class="form-label">Buscar por</label>
              <select id="assign-search-field" class="form-select">
                <option value="name">Nome</option>
                <option value="email">E-mail</option>
                <option value="job_title">Cargo</option>
                <option value="city">Cidade</option>
                <option value="state">UF</option>
                <option value="bio">Bio</option>
              </select>
            </div>
            <div class="col-md-6">
              <label for="assign-search-value" class="form-label">Valor</label>
              <input type="text" class="form-control" id="assign-search-value" placeholder="Digite para buscar">
            </div>
            <div class="col-md-2 d-grid">
              <button type="button" class="btn btn-secondary" id="assign-user-search">Buscar</button>
            </div>
          </div>
          <ul id="assign-search-results" class="list-group mt-3"></ul>
          <div id="assign-selected-user" class="alert alert-info mt-3 mb-0">Nenhum usuário selecionado.</div>
          <div id="assign-task-feedback" class="alert alert-danger mt-3 d-none" role="alert"></div>
        </div>
        <div class="modal-footer">
          <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Cancelar</button>
          <button type="button" class="btn btn-primary" id="assign-task-submit">Criar tarefa</button>
        </div>
      </div>
    </div>
  </div>

  <div class="container">
    <div id="assign-task-page-feedback" class="alert alert-success mt-3 d-none" role="status"></div>
  </div>

  <footer class="bg-primary text-white text-center py-3 mt-auto">
    <div class="small">Frontend 2026.2</div>
  </footer>

  <script
    src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"
    integrity="sha384-YvpcrYf0tY3lHB60NNkmXc5s9fDVZLESaAA55NDzOxhy9GkcIdslK1eN7N6jIeHz"
    crossorigin="anonymous"
  ></script>

</body>

</html>
